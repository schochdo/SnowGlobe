<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background warm alabaster circle -->
  <rect width="512" height="512" rx="112" fill="#FAF8F3" />
  <!-- Inner circular globe border -->
  <circle cx="256" cy="256" r="216" fill="#F0EDE4" stroke="#2C2A27" stroke-width="16" />
  <!-- Stylized Mountain Peaks -->
  <!-- Back ridge (subtle) -->
  <polygon points="120,380 200,240 270,380" fill="#D6D0C2" stroke="#2C2A27" stroke-width="10" stroke-linejoin="round" />
  <polygon points="200,240 220,275 190,290 200,240" fill="#FFFFFF" />
  <!-- Secondary Peak (right) -->
  <polygon points="230,380 340,210 410,380" fill="#B8B0A2" stroke="#2C2A27" stroke-width="10" stroke-linejoin="round" />
  <!-- Snowcap right -->
  <polygon points="340,210 365,260 340,275 320,260 340,210" fill="#FFFFFF" stroke="#2C2A27" stroke-width="6" stroke-linejoin="round" />
  <!-- Primary Peak (center/left) -->
  <polygon points="130,380 240,160 350,380" fill="#2C2A27" stroke="#2C2A27" stroke-width="12" stroke-linejoin="round" />
  <!-- Snowcap center -->
  <polygon points="240,160 275,230 250,245 235,230 215,245 205,230 240,160" fill="#FFFFFF" stroke="#2C2A27" stroke-width="8" stroke-linejoin="round" />
  <!-- Piste / Contour line curving down the mountain -->
  <path d="M 245,250 Q 210,300 260,340 T 290,380" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 1" />
  <!-- Snowflake crystal in the upper sky -->
  <g transform="translate(370, 140) scale(0.9)" stroke="#2C2A27" stroke-width="6" stroke-linecap="round">
    <line x1="0" y1="-28" x2="0" y2="28" />
    <line x1="-28" y1="0" x2="28" y2="0" />
    <line x1="-20" y1="-20" x2="20" y2="20" />
    <line x1="-20" y1="20" x2="20" y2="-20" />
    <!-- V ticks -->
    <path d="M -6,-18 L 0,-24 L 6,-18" fill="none" />
    <path d="M -6,18 L 0,24 L 6,18" fill="none" />
    <path d="M -18,-6 L -24,0 L -18,6" fill="none" />
    <path d="M 18,-6 L 24,0 L 18,6" fill="none" />
  </g>
</svg>
